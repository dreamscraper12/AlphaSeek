[project]
name = "portfolio"
version = "0.1.0"
description = "Ledger-driven valuation and performance pipeline for the portfolio site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
]

[project.scripts]
portfolio = "portfolio.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
