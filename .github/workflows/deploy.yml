name: Deploy site

# Deploys to GitHub Pages on every push to master, which includes the
# commits daily.yml makes when a valuation changes data/generated —
# so a new valuation publishes itself (CLAUDE.md section 10).
on:
  push:
    branches: [master]
  # daily.yml commits with the default GITHUB_TOKEN, and GitHub does not
  # trigger workflows from those pushes — so a valuation would commit and
  # never publish. This starts the deploy explicitly instead (CLAUDE.md
  # section 10).
  workflow_run:
    workflows: ["Daily valuation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a valuation
# commit is not dropped in favour of a later unrelated push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # On a workflow_run trigger, only publish if the valuation actually
    # succeeded; types: [completed] fires on failure too.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
